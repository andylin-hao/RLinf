defaults:
  - env/realworld_dual_yam_joint@env.eval
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/embodiment/config

cluster:
  num_nodes: 1
  component_placement:
    env:
      node_group: yam
      placement: 0
  node_groups:
    - label: yam
      node_ranks: 0
      hardware:
        type: DualYam
        configs:
          - node_rank: 0
            left_follower:
              channel: mock_left
              arm_type: yam
              gripper_type: flexible_4310
              ee_mass: null
              gripper_limits: null
            right_follower:
              channel: mock_right
              arm_type: yam
              gripper_type: flexible_4310
              ee_mass: null
              gripper_limits: null
            cameras:
              - name: top_rgb
                serial: MOCK0001
                camera_type: realsense
                resolution: [64, 48]
                fps: 30
              - name: left_rgb
                serial: MOCK0002
                camera_type: realsense
                resolution: [64, 48]
                fps: 30
              - name: right_rgb
                serial: MOCK0003
                camera_type: realsense
                resolution: [64, 48]
                fps: 30

runner:
  task_type: embodied
  logger:
    log_path: /workspace/results/realworld_dual_yam_collect_data_mock
    project_name: rlinf
    experiment_name: ci-test
    logger_backends: [tensorboard]
  num_data_episodes: 1
  record_task_description: true

env:
  group_name: EnvGroup
  eval:
    ignore_terminations: false
    auto_reset: false
    teleop: yam_pico
    max_episode_steps: 300
    pico:
      hand: dual
      zmq_addr: mock://yam-pico
      position_scale: 0.3
      rotation_scale: 0.3
      rotation_delta_frame: operator
      control_threshold: 0.85
      max_stale_s: 0.2
      max_position_delta: 0.005
      max_rotation_delta: 0.03
      max_tick_s: 0.1
      ik_backtrack_attempts: 3
      wait_for_record_button: true
      record_button: right_menu_button
      discard_button: left_menu_button
      button_debounce_s: 0.2
      keyboard_enabled: false
      ik:
        site_name: grasp_site
        solver: quadprog
        max_iters: 30
        dt: 0.01
        position_tolerance: 0.001
        rotation_tolerance: 0.01
        max_solve_s: 0.03
    override_cfg:
      is_dummy: false
      enforce_runtime_joint_limits: true
      manual_episode_control_only: true
      max_num_steps: 300
      image_height: 48
      image_width: 64
      reset:
        enabled: false
      park_on_close:
        enabled: false
    data_collection:
      enabled: true
      save_dir: ${runner.logger.log_path}
      export_format: lerobot_dataset
      streaming: true
      only_success: false
      robot_type: dual_yam
      fps: 30
      finalize_interval: 10
