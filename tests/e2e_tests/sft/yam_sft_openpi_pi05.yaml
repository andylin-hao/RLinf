defaults:
  - realworld_dual_yam_sft_openpi_pi05
  - _self_

hydra:
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/sft/config

cluster:
  component_placement:
    actor: 0-1

runner:
  logger:
    log_path: ${oc.env:YAM_CI_LOG_PATH}
    experiment_name: ci_yam_openpi_sft
    logger_backends: null
  max_epochs: -1
  max_steps: 2
  save_interval: 1

data:
  train_data_paths: ${oc.env:YAM_CI_DATASET}
  num_workers: 0

actor:
  micro_batch_size: 1
  global_batch_size: 2
  model:
    model_path: /workspace/dataset/pi05_base
    openpi_data:
      norm_stats_path: ${oc.env:YAM_CI_DATASET}/norm_stats.json
